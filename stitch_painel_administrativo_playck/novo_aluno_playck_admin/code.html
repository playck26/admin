</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email <span class="text-tertiary">*</span></label>
<input class="w-full h-11 px-4 rounded-lg bg-surface-container-lowest border border-[#EAECE6] text-on-surface font-body-sm text-body-sm input-glow transition-all duration-200 placeholder:text-outline" id="email" name="email" placeholder="email@exemplo.com" required="" type="email"/>
</div>
