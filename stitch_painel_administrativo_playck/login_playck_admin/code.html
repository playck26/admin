<body class="bg-background min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl p-8 tactile-shadow">
<div class="mb-stack-lg text-center">
<div class="flex justify-center mb-6">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" data-weight="fill" style="font-size: 28px;">sports_tennis</span>
</div>
</div>
<h1 class="font-page-title text-page-title text-on-surface mb-2">Entrar</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Painel do dono da escola/arena — PlayCK</p>
</div>
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="font-body-lg text-body-lg bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="password">Senha</label>
<div class="relative">
<input class="w-full font-body-lg text-body-lg bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-12 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center px-4 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="mt-2">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-6 rounded-lg hover:bg-surface-tint active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Entrar
                </button>
</div>
</form>
